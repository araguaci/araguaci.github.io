    summary: "Extração, normalização e identificação visual de anomalias epidemiológicas em milhões de registros oficiais de óbito do Brasil."
    problem_statement: >
      Os microdados de mortalidade do Ministério da Saúde são distribuídos em formatos proprietários compactados
      (arquivos DBC), exigindo descompressão especializada e limpeza de inconsistências cadastrais.
    key_learnings:
