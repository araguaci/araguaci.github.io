  - id: "DEV-2026-008"
    date: "2026-08-20"
    title: "Processamento Visual com Shaders WebGL (GLSL) e Gravação Nativa WebM no Cliente"
    category: "frontend"
    tags: [webgl, glsl, shaders, canvas, video-export]
    slug: "processamento-visual-shaders-webgl-glsl-webm"
    summary: "Construção de estúdios visuais generativos de efeitos CRT, aberração cromática RGB e ruído analógico com renderização na placa de vídeo."
    problem_statement: >
      Aplicar filtros visuais complexos pixel a pixel em imagens e vídeos usando Canvas 2D em JavaScript puro
      é inviável para processamento em tempo real a 60 frames por segundo.
    key_learnings:
      - "Fragment Shaders em GLSL executam cálculos paralelizados em cada fragmento diretamente nos núcleos da GPU."
      - "A 'MediaRecorder API' permite capturar o fluxo gráfico ('canvas.captureStream(60)') e gerar arquivos WebM em alta resolução sem servidores de renderização."
      - "Técnicas de distorção de lentes em coordenadas polares produzem curvaturas autênticas de monitores de tubo (CRT)."
    code_snippet: |
      // Fragment Shader: Aberração Cromática RGB
      precision mediump float;
      uniform sampler2D u_image;
      varying vec2 v_texCoord;
      uniform float u_offset;
      void main() {
        float r = texture2D(u_image, v_texCoord + vec2(u_offset, 0.0)).r;
        float g = texture2D(u_image, v_texCoord).g;
        float b = texture2D(u_image, v_texCoord - vec2(u_offset, 0.0)).b;
        gl_FragColor = vec4(r, g, b, 1.0);
      }
    impact_value: "Lançamento do GlitchLab e ChromaMesh como ferramentas criativas autônomas do ecossistema Artes do Sul."
    related_projects: ["glitchlab.artesdosul.com", "chromamesh.artesdosul.com"]

  - id: "DEV-2026-009"
    date: "2026-08-15"
    title: "Auditoria Jurimétrica de Supersalários e Captura Institucional com Corpus CC0"
    category: "osint"
    tags: [jurimetria, dados-abertos, cc0, judiciario, transparência]
    slug: "auditoria-jurimetrica-supersalarios-corpus-cc0"
    summary: "Mineração de dados de remuneração de magistrados, quebra de 'penduricalhos' indenizatórios e disponibilização de base aberta sob Creative Commons Zero."
    problem_statement: >
      Tribunais brasileiros mascaram supersalários por meio de dezenas de rubricas indenizatórias obscuras
      (folgas compensatórias, acúmulo de acervo), dificultando a fiscalização cidadã.
    key_learnings:
      - "A divisão entre 'remuneração paradigma' (subteto) e 'vantagens eventuais' é o mecanismo padrão de dreno orçamentário."
      - "O cálculo da mediana regional de rendimentos em cotejo com a folha dos tribunais revela disparidades superiores a 40x o salário mínimo."
      - "Bases em JSON tipado disponibilizadas em repositórios abertos garantem perenidade contra remoção de portais públicos."
    code_snippet: |
      // Cálculo de Excesso de Teto Constitucional
      interface Contracheque {
        subsidio: number;
        indenizatorias: number;
        retencaoTeto: number;
      }
      function calcularLiquidoReal(c: Contracheque): number {
        return (c.subsidio - c.retencaoTeto) + c.indenizatorias;
      }
    impact_value: "Base de apoio para pesquisadores cívicos e jornalistas independentes com dados irrefutáveis (JusMonitor)."
    related_projects: ["jusmonitor.vercel.app", "observatorio-civil-br.vercel.app"]

