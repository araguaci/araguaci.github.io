    slug: "infraestrutura-soberana-homelab-proxmox-docker-wireguard"
    summary: "Guia arquitetural para implantação de uma nuvem privada residencial e corporativa com isolamento de serviços, bloqueio de telemetria e acesso remoto seguro."
    problem_statement: >
      A dependência exclusiva de serviços de nuvem pública (AWS, GCP) gera custos crescentes em dólar, dependência
      de políticas arbitrárias de terceiros e perda de controle sobre a privacidade de dados corporativos.
    key_learnings:
      - "O Proxmox VE oferece hipervisor bare-metal leve para separação entre contêineres de alta densidade (LXC) e máquinas virtuais isoladas."
      - "A orquestração via Docker Compose permite versionar em arquivos YAML toda a pilha de serviços (Home Assistant, Pi-hole, Uptime Kuma)."
      - "A criação de túneis WireGuard ponto-a-ponto permite gerenciar a bancada de servidores de qualquer lugar sem abrir portas vulneráveis no roteador."
    code_snippet: |
      # docker-compose.yml básico de Homelab Seguro
      services:
        pihole:
          image: pihole/pihole:latest
          ports:
            - "53:53/tcp"
            - "53:53/udp"
            - "8080:80/tcp"
          restart: unless-stopped
        wireguard:
          image: linuxserver/wireguard:latest
          cap_add:
            - NET_ADMIN
          restart: unless-stopped
