  - id: "DEV-2026-001"
    date: "2026-10-01"
    title: "Resolução de Conflitos no GitHub Actions: Modernização de Ruby 2.6 para 3.3 e a Falha da Gem FFI"
    category: "devops"
    tags: [github-actions, ruby, jekyll, ffi, ci-cd, bundler]
    slug: "resolucao-conflitos-github-actions-ruby3-gem-ffi"
    summary: "Diagnóstico profundo e correção definitiva de falha em pipeline de CI no GitHub Actions decorrente do uso de containers legados com Ruby 2.6 incompatíveis com gems modernas."
    problem_statement: >
      O workflow de CI rodava o container 'jekyll/builder:3.8' (com Ruby 2.6.3p62). O Bundler falhou ao instalar
      a gem 'ffi-1.17.4', que exige estritamente Ruby >= 3.0, quebrando o pull request com Exit Code 5.
    key_learnings:
      - "Imagens Docker antigas de construtores de Jekyll congelam versões descontinuadas do Ruby e quebram quando o Rubygems resolve dependências transitivas contemporâneas."
      - "O padrão moderno oficial para Jekyll no GitHub Actions dispensa Docker e usa a action nativa 'ruby/setup-ruby@v1' com 'bundler-cache: true'."
      - "A migração para 'actions/checkout@v4' e Ruby 3.3 reduziu o tempo médio de compilação da pipeline de 3 minutos para apenas 17 segundos."
    code_snippet: |
      # .github/workflows/ci.yml moderno
      name: Beautiful Jekyll CI
      on: [push, pull_request]
      jobs:
        build:
          runs-on: ubuntu-latest
          steps:
            - uses: actions/checkout@v4
            - uses: ruby/setup-ruby@v1
              with:
                ruby-version: '3.3'
                bundler-cache: true
            - run: bundle exec jekyll build --future
              env:
                JEKYLL_ENV: production
    impact_value: "Pipeline de CI 100% verde, eliminando alertas de depreciação do Node e blindando o repositório contra dependências que exigem Ruby 3+."
    related_projects: ["artesdosul.github.io", "araguaci.github.io"]

  - id: "DEV-2026-002"
    date: "2026-10-01"
    title: "A Armadilha do 'vendor/bundle' no Jekyll: Exclusão Obrigatória no _config.yml"
    category: "devops"
    tags: [jekyll, bundler, config-yml, debugging, ruby]
    slug: "armadilha-vendor-bundle-jekyll-exclude"
    summary: "Como evitar que o Jekyll tente processar arquivos de template internos das gems instaladas como se fossem posts do próprio blog."
    problem_statement: >
      Ao ativar 'bundler-cache: true', as gems são instaladas no caminho local 'vendor/bundle'. O Jekyll tentou
      processar 'vendor/bundle/.../jekyll-3.10.0/.../_posts/0000-00-00-welcome-to-jekyll.markdown.erb' como post,
      falhando com erro fatal de data inválida em tag ERB.
    key_learnings:
      - "Quando a diretiva 'exclude:' é declarada no '_config.yml', o Jekyll substitui totalmente sua lista padrão de exclusões."
      - "Se 'vendor/' não for recolocado explicitamente em 'exclude:', o Jekyll fará varredura recursiva em todo o código-fonte das gems instaladas."
      - "Arquivos de exemplo e geradores internos de gems com extensão '.markdown.erb' quebram o parser de frontmatter do Jekyll."
    code_snippet: |
      # _config.yml - Exclusão obrigatória de artefatos de build
      exclude:
        - vendor/
        - .bundle/
        - .sass-cache/
        - .jekyll-cache/
        - Gemfile
        - Gemfile.lock
    impact_value: "Zero falsos positivos de compilação em ambientes de integração contínua (GitHub Actions e Vercel)."
    related_projects: ["artesdosul.github.io", "araguaci.github.io"]

  - id: "DEV-2026-003"
    date: "2026-10-01"
    title: "Engenharia de Contraste em Headers Heróicos: Stacking Context e Overlay Gradiente"
    category: "frontend"
    tags: [css, acessibilidade, wcag, beautiful-jekyll, design-system]
    slug: "engenharia-contraste-headers-heroicos-stacking-context"
    summary: "Técnica definitiva de camadas CSS (z-index e pseudo-elementos) para garantir leitura de títulos sobre qualquer imagem de fundo sem recorrer a caixas opacas."
    problem_statement: >
      Aplicar 'background-color: rgba(255,255,255,0.6)' no seletor '.intro-header.big-img' não surtia efeito
      porque a cor fica fisicamente atrás da 'background-image'. Títulos brancos colidiam com áreas claras de fotos.
    key_learnings:
      - "Propriedades 'background-color' nunca criam overlays sobre 'background-image' do mesmo elemento no box model da W3C."
      - "A solução robusta requer um pseudo-elemento '::before' com 'position: absolute', 'pointer-events: none' e gradiente vertical (180deg)."
      - "O container do texto deve receber 'position: relative' e 'z-index: 2' para elevar a tipografia acima da camada escura de oclusão."
      - "Text-shadow duplo de alta dispersão garante conformidade com o padrão WCAG AAA (>7:1)."
    code_snippet: |
      .intro-header.big-img { position: relative; }
      .intro-header.big-img::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(10,15,26,0.55) 0%, rgba(10,15,26,0.88) 100%);
        z-index: 1;
        pointer-events: none;
      }
      .intro-header.big-img .container-md {
        position: relative;
        z-index: 2;
      }
    impact_value: "Legibilidade impecável em 100% dos posts heróicos em telas mobile e desktop sob qualquer iluminação ambiente."
    related_projects: ["artesdosul.github.io", "modelos.artesdosul.com"]

  - id: "DEV-2026-004"
    date: "2026-09-28"
    title: "Arquitetura PWA Offline-First para Aplicações Devocionais e Espirituais"
    category: "arquitetura"
    tags: [pwa, service-worker, offline-first, localstorage, web-audio]
    slug: "arquitetura-pwa-offline-first-aplicacoes-devocionais"
    summary: "Como projetar Progressive Web Apps autônomos que funcionam perfeitamente sem conexão de internet, com feedback sensorial táctil e síntese de áudio leve."
    problem_statement: >
      Aplicações de oração e recolhimento não podem depender de conexões instáveis em áreas rurais ou capelas,
      nem expor o usuário a rastreadores de anúncios invasivos.
    key_learnings:
      - "Service Workers com estratégia 'Cache-First' para ativos estáticos permitem inicialização instantânea (0ms de rede)."
      - "A Web Audio API permite sintetizar sinos e campainhas harmônicas proceduralmente sem carregar arquivos MP3 volumosos."
      - "A API de vibração nativa ('navigator.vibrate') fornece resposta háptica sutil para contagem de contas do Santo Terço."
    code_snippet: |
      // Síntese procedural de campainha sacra (Web Audio API)
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      function playBell(freq = 587.33) {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 2.5);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 2.5);
      }
    impact_value: "Criação de santuários digitais autônomos (Mãe Maria, Os Filhos da Terra) com nota 100 em auditorias Lighthouse."
    related_projects: ["mae-maria.artesdosul.com", "filhosdaterra.artesdosul.com"]

  - id: "DEV-2026-005"
    date: "2026-09-25"
    title: "Síntese Sonora Procedural em 432Hz & Ressonância Schumann com Web Audio API"
    category: "frontend"
    tags: [web-audio, 432hz, som-procedural, brown-noise, performance]
    slug: "sintese-sonora-procedural-432hz-web-audio-api"
    summary: "Substituição de arquivos de áudio pesados de meditação por geradores procedurais de ruído rosa, frequências harmônicas e filtros passa-baixa em tempo real."
    problem_statement: >
      Streaming de faixas sonoras de meditação em alta fidelidade consome gigabytes de transferência e falha em
      dispositivos com conexões lentas ou dados limitados.
    key_learnings:
      - "A criação de 'AudioBufferSourceNode' com ruído rosa modulado simula com perfeição o farfalhar do vento em pinheiros."
      - "Osciladores duplos com ligeiro 'detune' (ex: 432Hz e 439.83Hz) geram batimentos binaurais que induzem relaxamento profundo."
      - "Todo o motor sonoro cabe em menos de 100 linhas de JavaScript puro, consumindo menos de 2% de CPU."
    code_snippet: |
      // Gerador de Ruído Rosa Procedural (Algoritmo de Paul Kellet)
      const bufferSize = ctx.sampleRate * 2;
      const noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const output = noiseBuffer.getChannelData(0);
      let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
      for (let i = 0; i < bufferSize; i++) {
        const white = Math.random() * 2 - 1;
        b0 = 0.99886 * b0 + white * 0.0555179;
        b1 = 0.99332 * b1 + white * 0.0750759;
        b2 = 0.96900 * b2 + white * 0.1538520;
        output[i] = (b0 + b1 + b2) * 0.11;
      }
    impact_value: "Experiência auditiva hipnótica e imersiva sem custo de largura de banda ou dependência de servidores de mídia."
    related_projects: ["filhosdaterra.artesdosul.com", "gaia.artesdosul.com"]

  - id: "DEV-2026-006"
    date: "2026-09-15"
    title: "Comunicação IoT de Ultrabaixa Latência (<5ms) com Protocolo ESP-NOW em Microcontroladores"
    category: "iot"
    tags: [esp32, esp-now, iot, sistemas-embarcados, wireless]
    slug: "comunicacao-iot-ultrabaixa-latencia-esp-now"
    summary: "Arquitetura de rede em malha proprietária para telemetria local e acionamento de atuadores sem uso de roteadores Wi-Fi ou servidores em nuvem."
    problem_statement: >
      O protocolo Wi-Fi tradicional com handshake TCP/IP e negociação DHCP introduz latências de 200ms a 2s e
      falha catastrófica quando o roteador doméstico reinicia ou perde a conexão WAN.
    key_learnings:
      - "O protocolo ESP-NOW transmite pacotes diretos em camada 2 (MAC address) na faixa de 2.4 GHz em menos de 4 milissegundos."
      - "Permite que sensores alimentados por bateria permaneçam em 'Deep Sleep' por meses, acordando apenas para disparar uma rajada de dados."
      - "Módulos repetidores com ESP32 e antenas PCB de ganho cobrem propriedades rurais e bancadas de teste sem infraestrutura de rede."
    code_snippet: |
      // Envio básico ESP-NOW em C++ (Arduino Framework)
      #include <esp_now.h>
      #include <WiFi.h>
      uint8_t peerAddress[] = {0x24, 0x0A, 0xC4, 0xXX, 0xXX, 0xXX};
      void setup() {
        WiFi.mode(WIFI_STA);
        if (esp_now_init() != ESP_OK) return;
        esp_now_peer_info_t peerInfo = {};
        memcpy(peerInfo.peer_addr, peerAddress, 6);
        peerInfo.channel = 0;
        peerInfo.encrypt = false;
        esp_now_add_peer(&peerInfo);
      }
    impact_value: "Infraestrutura soberana de bancada e automação predial imune a quedas de provedores de internet."
    related_projects: ["oficina.artesdosul.com", "homelab.artesdosul.com"]

