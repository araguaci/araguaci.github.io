entries:
- id: DEV-2026-071
  date: '2026-10-07'
  title: Service Worker exige Response valida em respondWith para evitar ERR_FAILED
    na Vercel
  category: frontend
  tags:
  - pwa
  - service-worker
  - astro
  - vercel
  - cache
  slug: service-worker-exige-response-valida-respondwith-evitar-err-failed
  summary: Ao implementar cache PWA, o metodo respondWith do Service Worker quebrou
    assets estaticos na Vercel por receber undefined. Passou a valer a regra de nunca
    resolver promises sem Response valida e desativar preload de fontes nao renderizadas
    de imediato.
  problem_statement: 'Apos deploy na Vercel, fontes .woff2 e scripts hoisted do Astro
    falharam com net::ERR_FAILED e TypeError: Failed to convert value to Response
    no sw.js, travando o carregamento da aplicacao.'
  key_learnings:
  - O metodo event.respondWith() no sw.js exige estritamente uma instancia de Response;
    retornar undefined no fallback de caches.match ou no catch bloqueia a requisicao
    do navegador com net::ERR_FAILED.
  - Requisicoes com Stale-While-Revalidate devem buscar na rede quando ausentes no
    cache e retornar Response explicita em caso de falha de conexao, nunca deixando
    a promise resolver vazia.
  - 'Preload de fontes (preload: true) so deve ser mantido para tipografias ativamente
    renderizadas no primeiro viewport; fontes secundarias devem usar preload: false
    para evitar warnings no console.'
  code_snippet: "// public/sw.js - Garantir sempre Response valida no respondWith\n\
    event.respondWith(\n  caches.match(event.request).then((cached) => {\n    if (cached)\
    \ return cached;\n    return fetch(event.request).catch(() => {\n      return\
    \ new Response('', { status: 408, statusText: 'Request failed' });\n    });\n\
    \  })\n);"
  impact_value: Eliminacao completa das falhas de rede na Vercel e restauracao do
    carregamento offline seguro dos assets.
  related_projects:
  - portfolio-astro
