  - id: "DEV-2026-109"
    date: "2026-11-04"
    title: "Nome de arquivo com travessão derruba o Jekyll na Vercel, e o Windows não mostra o erro"
    category: "devops"
    tags: [jekyll, vercel, utf-8, locale, ruby]
    slug: "nome-de-arquivo-nao-ascii-derruba-jekyll-na-vercel"
    summary: "O build passava no Windows e falhava na Vercel, por causa de um arquivo estático com caractere fora do ASCII no nome. Uma variável de ambiente resolveu sem mudar nenhuma URL pública."
    problem_statement: >
      O jekyll build na Vercel parou com a mensagem "\xE2" from ASCII-8BIT to UTF-8 em um arquivo estático com travessão no nome.
      O mesmo build funcionava na máquina Windows, e renomear o arquivo mudaria uma URL já publicada.
    key_learnings:
      - "O byte xE2 é o início do travessão em UTF-8, e ASCII-8BIT mostra que o Ruby leu o nome do arquivo sem encoding definido."
      - "LC_ALL=C.UTF-8 no projeto da Vercel dá o locale que o ambiente de build não define."
      - "Ajustar o ambiente preserva as URLs públicas. Renomear o arquivo resolveria o erro, mas quebraria quem já tem o link."
    code_snippet: |
      # Variável de ambiente do projeto na Vercel
      LC_ALL=C.UTF-8
    impact_value: "O build voltou a passar na Vercel sem mudar nenhum endereço publicado."
    related_projects: ["artesdosul"]

  - id: "DEV-2026-110"
    date: "2026-11-04"
    title: "Com jekyll-optional-front-matter, nota solta no repositório pode virar página pública"
    category: "devops"
    tags: [jekyll, privacidade, markdown, notas]
    slug: "optional-front-matter-publica-nota-solta"
    summary: "O plugin faz o Jekyll tratar arquivo Markdown sem front matter como página. Por isso, as notas pessoais ficaram numa pasta fora do repositório do site."
    problem_statement: >
      Era preciso decidir onde guardar as notas de trabalho, e o repositório do site era um lugar possível.
      No site, com jekyll-optional-front-matter ativo, um .md solto pode sair publicado como página, ainda que não tenha cabeçalho.
    key_learnings:
      - "Não ter front matter não torna um arquivo privado: com o plugin, o .md vira página renderizada. Só o que está no exclude ou fora da pasta fica de fora do build."
      - "A pasta de notas foi para fora do repositório. Depender de uma lista exclude é arriscado, porque um novo arquivo fora da lista já seria publicado."
      - "Antes de guardar texto privado em um repositório de site, confira os plugins ativos no _config.yml."
    impact_value: "As notas ficam fora do alcance do build do site, sem depender de uma lista de exclusão."
    related_projects: ["artesdosul", "segundo-cerebro"]
