entries:
  - id: "DEV-2026-080"
    date: "2026-05-29"
    title: "Um corpus analítico precisa dizer ao modelo de linguagem como tratar evidência"
    category: "ia"
    tags: [llm, metodologia, corpus, osint]
    slug: "corpus-analitico-protocolo-para-modelo-de-linguagem"
    summary: "Um modelo pode entender um dado documentado e ainda assim diluí-lo como se fosse opinião. A metodologia do lawfare-timeline passou a nomear esse padrão e a dar ao modelo marcadores para reconhecê-lo nas próprias respostas."
    problem_statement: >
      O projeto documenta padrões com metodologia explícita, e a colaboração com IA precisa manter a mesma régua ao longo do tempo.
      O risco observado é a falsa equivalência: o modelo compreende o conteúdo e o descarta por metadado de fonte, tom ou campo político aparente.
    key_learnings:
      - "O METHODOLOGY.md define o padrão P04b, a falsa equivalência que neutraliza um dado sem produzir conteúdo ofensivo, e registra que ela pode ocorrer sem intenção."
      - "Os marcadores são verificáveis na resposta: citar 'alguns críticos argumentam' sem refutar o dado disponível, ou propor perspectivas igualmente válidas diante de um padrão com evidência."
      - "A classificação separa o que está confirmado (ev-confirmed) do que é inferência (ev-inference). Item confirmado no corpus é tratado como dado, não como perspectiva."
      - "Campo booleano também exige prova: vetor_correcao_disponivel só recebe false com evidência positiva de bloqueio."
      - "Faixas de IDs protegidas só aceitam merge com validação explícita, e essa regra fica escrita junto com o schema."
    impact_value: "O protocolo para modelos virou parte da metodologia versionada, e não uma instrução repetida a cada sessão."
    related_projects: ["lawfare-timeline"]

  - id: "DEV-2026-081"
    date: "2026-06-12"
    title: "Junction libera o disco C: sem mudar o caminho, e a limpeza não pode atravessá-la"
    category: "windows"
    tags: [windows, junction, disco, powershell, manutencao]
    slug: "junction-libera-disco-e-limpeza-nao-atravessa"
    summary: "O C: chegou a 7,4 GB livres, com caches e a VM do Claude Desktop ocupando a maior parte. Mover a VM por junction resolveu na hora, e a limpeza recorrente virou um script com dry-run e lista de caminhos permitidos."
    problem_statement: >
      A pasta vm_bundles do Claude Desktop ocupava 11,8 GB, e os caches de NuGet, npm e pip somavam cerca de 34 GB.
      O app espera a pasta no caminho original, e o disco volta a encher com o uso normal de desenvolvimento.
    key_learnings:
      - "Mover a pasta para outro disco e criar uma junction no caminho original mantém o app funcionando sem configuração nova."
      - "A junction cria uma dependência: se o app acusar erro de VM, confira primeiro se o disco de destino está montado e se a junction continua intacta."
      - "O CleanGuard só apaga com -Executar. Sem esse parâmetro, faz apenas o dry-run."
      - "A lista de raízes permitidas fica no código, e o script recusa qualquer caminho fora dela. Também nunca atravessa junction ou symlink, o que protege a própria pasta migrada."
      - "A tarefa agendada de toda segunda roda o perfil seguro, sem administrador. O perfil completo, com Temp do sistema, Windows Update e WinSxS, fica para execução manual."
    code_snippet: |
      # Sem -Executar, só mostra o que seria apagado
      .\cleanguard.ps1
      .\cleanguard.ps1 -Executar
      .\cleanguard.ps1 -Executar -Perfil completo
    impact_value: "O espaço do C: passou a ser recuperado por rotina semanal, sem limpeza manual a cada aperto."
    related_projects: ["00-cleanguard"]

  - id: "DEV-2026-082"
    date: "2026-06-15"
    title: "O motor de alertas já estava no banco, e faltava só agendar e notificar"
    category: "backend"
    tags: [mysql, php, stored-procedure, alertas, phpmaker]
    slug: "motor-de-alertas-ja-estava-no-banco"
    summary: "A primeira tentativa de automatizar alertas de consumo reimplementou em PHP o que uma migration já tinha criado. Ao reaproveitar o que existia, a entrega ficou reduzida a um script de agendamento e notificação."
    problem_statement: >
      O pedido era a fase A da automação: alertas e relatórios sobre as faturas já importadas.
      A tabela e as regras novas ficaram redundantes e em conflito com scripts/migration_relatorios_executivos.sql, já aplicada no banco local.
    key_learnings:
      - "Antes de escrever regra de negócio, procure também em migrations, procedures e views. O motor estava em sp_gera_alertas() e sp_processa_executivo(), fora do PHP."
      - "A tabela alerta já evitava duplicidade com UNIQUE(idfilial, tipo, competencia) e tinha o ciclo ABERTO, NOTIFICADO, RESOLVIDO e IGNORADO."
      - "O que faltava coube no monitor.php: chamar o orquestrador, enviar o resumo por e-mail e marcar NOTIFICADO, com --dry-run e --notify."
      - "Para o setup Docker funcionar, o ewcfg.php passou a ler as credenciais por getenv(), com o .env fora do Git."
    impact_value: "As regras de alerta continuam em um lugar só, e o dashboard executivo segue lendo a mesma tabela."
    related_projects: ["lorentz-energy"]

  - id: "DEV-2026-083"
    date: "2026-06-18"
    title: "Canal de WhatsApp em produção usa a Cloud API, e a solução por QR Code fica no laboratório"
    category: "arquitetura"
    tags: [whatsapp, meta, waha, integracao]
    slug: "whatsapp-cloud-api-e-qr-code-so-no-laboratorio"
    summary: "A primeira versão do plano apoiava o canal em WAHA, que não é a API oficial. A revisão contra o código trocou a base por Meta Cloud API e cortou o que não era necessário ao piloto."
    problem_statement: >
      A versão 1.0 do plano previa WAHA self-hosted, custo zero de API, orquestrador Node.js e sincronização dupla entre SQL Server e MySQL.
      Comparada ao repositório, ela citava um passo de QR Code que não existe na API oficial e ignorava o que o código já tinha.
    key_learnings:
      - "WAHA, Evolution e Baileys ficam só para protótipo: não são a API oficial e carregam risco de banimento."
      - "Custo de API por conversa precisa estar no plano. O 'R$ 0' da versão anterior subestimava o gasto real na Meta."
      - "O orquestrador Node.js saiu porque a ponte PHP/Laravel existente basta. Stack extra sem necessidade também é custo de operação."
      - "A sincronização dupla virou opcional numa fase posterior. No piloto há uma única fonte operacional, o que reduz a complexidade."
      - "Revisar o plano contra o código revelou que o WhatsAppService só persistia localmente e não chamava a Meta."
    impact_value: "O plano passou a descrever o que pode ir para produção, com os estudos de WAHA isolados em projetos/."
    related_projects: ["omnichannel-system", "lorentz-supervisor"]

  - id: "DEV-2026-084"
    date: "2026-06-21"
    title: "Modernizar sem parar o legado muda como se projeta cada integração nova"
    category: "arquitetura"
    tags: [legado, whatsapp, modernizacao, strangler-fig]
    slug: "integracao-nova-precisa-servir-legado-e-base-moderna"
    summary: "Novos clientes passaram a exigir WhatsApp enquanto a base instalada segue no stack legado. A regra passou a ser projetar a integração para funcionar no legado e servir também à plataforma moderna."
    problem_statement: >
      O negócio precisa fechar contratos novos sem quebrar quem já roda CTI, URA, cliente desktop e Supervisor em produção.
      Desenvolver o canal só na plataforma nova deixaria esses clientes de fora, e desenvolvê-lo só no legado obrigaria a refazer tudo depois.
    key_learnings:
      - "Modernizar e manter o legado são duas frentes simultâneas: o legado continua recebendo as soluções novas."
      - "A integração precisa encaixar no Supervisor e no CTI legados e ao mesmo tempo servir de base para a plataforma moderna."
      - "Listar nominalmente os projetos em produção evita tratar como descartável algo de que um cliente ainda depende."
    impact_value: "O planejamento do WhatsApp passou a considerar o legado e a plataforma moderna desde o início."
    related_projects: ["omnichannel-system", "lorentz-supervisor", "lorentz-cti"]

  - id: "DEV-2026-085"
    date: "2026-06-21"
    title: "Nem todo segredo encontrado no histórico tem a mesma urgência"
    category: "seguranca"
    tags: [segredos, git, rotacao, filter-repo]
    slug: "segredo-no-historico-urgencia-depende-da-exposicao"
    summary: "A varredura dos repositórios encontrou credenciais com riscos muito diferentes. A prioridade passou a seguir a exposição real de cada uma, e a rotação ficou à frente da reescrita do histórico."
    problem_statement: >
      Ao preparar os repositórios para trabalhar com o claude.ai, apareceram credenciais em código e no histórico do Git.
      Tratar todas igualmente levaria a recompilar componentes legados com pressa, enquanto o risco real estava em outra credencial.
    key_learnings:
      - "Credencial de banco acessível por IP público é o risco real e vem primeiro. Credencial de banco que só escuta na interface local, em repositório privado, tem urgência menor."
      - "Reescrever o histórico não dispensa a rotação: a credencial já esteve em remotos e em outros clones. A rotação é o que neutraliza o risco."
      - "Credencial presa em código compilado só muda com nova compilação. A correção de longo prazo é parametrizar, seguindo o padrão de configuração externa."
      - "Arquivo de configuração sai do versionamento e dá lugar a um .sample. Antes do git pull no servidor, faça backup do arquivo real, porque a remoção do versionamento pode apagá-lo."
    code_snippet: |
      # Depois de rotacionar, limpar o histórico é a etapa seguinte, não a primeira
      git filter-repo --replace-text expressoes.txt
    impact_value: "A correção foi ordenada pela exposição real, sem expor o legado a uma recompilação apressada."
    related_projects: ["omnichannel"]

  - id: "DEV-2026-086"
    date: "2026-06-21"
    title: "Repositório-cópia para a IA duplica código que já tem origem própria"
    category: "devops"
    tags: [git, github, claude, repositorios]
    slug: "repositorio-copia-para-ia-duplica-a-origem"
    summary: "Um repositório focado foi criado para trabalhar o WhatsApp com o claude.ai e logo passou a duplicar código. A decisão foi conectar a ferramenta aos repositórios reais e descontinuar a cópia."
    problem_statement: >
      O repositório lorentz-whatsapp reunia num só lugar o que interessava à integração.
      Esse código já tinha origem própria em dois repositórios, então cada ajuste passaria a existir em dois lugares.
    key_learnings:
      - "Com uma fonte única da verdade, a ferramenta enxerga o histórico real e o trabalho não precisa de um passo de sincronização."
      - "Antes de conectar um repositório, confira o que há nele: chave de terceiro em documento e arquivo de configuração versionado saem antes."
      - "A decisão vale para os dois lados: a pasta local foi removida e o repositório remoto, que ficou redundante, foi marcado para exclusão."
    impact_value: "O trabalho do canal voltou a acontecer nos repositórios que vão para produção."
    related_projects: ["omnichannel-system", "lorentz-supervisor"]

  - id: "DEV-2026-087"
    date: "2026-06-21"
    title: "Uma pasta que parece cópia pode ser junction do mesmo repositório"
    category: "windows"
    tags: [windows, junction, git, checkout]
    slug: "pasta-que-parece-copia-pode-ser-junction"
    summary: "Em 2026-06-21, a pasta supervisor parecia um checkout independente, mas apontava para supervisor-php733. Quem ignora isso supõe duas árvores de trabalho onde só existe uma."
    problem_statement: >
      Duas pastas com o mesmo conteúdo sugeriam dois checkouts.
      Na verdade, supervisor era uma junction do Windows para supervisor-php733, com o mesmo .git e o mesmo HEAD.
    key_learnings:
      - "O atributo DL em Get-ChildItem indica diretório com reparse point. O nome e o conteúdo da pasta não mostram isso."
      - "Mudar de branch em uma das pastas muda também a outra, porque as duas compartilham o HEAD."
      - "Esse tipo de fato envelhece: naquele dia era uma junction, e em 2026-11-04 supervisor já era um repositório comum e supervisor-php733 não existia mais na máquina. Confira antes de confiar na anotação."
    code_snippet: |
      Get-ChildItem D:\projeto | Where-Object { $_.Attributes -match 'ReparsePoint' }
    impact_value: "Conferir o tipo da pasta passou a vir antes de qualquer decisão sobre qual checkout é o canônico."
    related_projects: ["lorentz-supervisor"]

  - id: "DEV-2026-088"
    date: "2026-06-21"
    title: "O piloto do assistente de IA começa pelo suporte do próprio sistema"
    category: "ia"
    tags: [ia, whatsapp, rag, suporte, piloto]
    slug: "piloto-do-assistente-comeca-pelo-proprio-suporte"
    summary: "Um assistente de IA exposto logo a clientes externos arrisca errar no domínio deles. O piloto usa o suporte do próprio Lorentz, e a fase de voz só abre quando os indicadores chegam ao valor definido."
    problem_statement: >
      A fase 4 do plano da URA para o WhatsApp precisava validar passagem de contexto, IA por texto e escalonamento.
      Era preciso escolher um domínio de baixo risco, em que a equipe conseguisse avaliar se a resposta estava certa.
    key_learnings:
      - "Instalação, configuração, administração e troubleshooting são um domínio que a equipe domina, logo o erro aparece rápido e o valor interno é imediato."
      - "A base de perguntas é ancorada na configuração real, e a matriz de escalonamento define quando a IA para e passa para uma pessoa."
      - "Toda conversa escalada vira candidata a nova FAQ, com curadoria quinzenal. O piloto evolui com chamados reais."
      - "A passagem de fase tem número: voz só com autoatendimento de pelo menos 40% e precisão de triagem de pelo menos 85%. São metas do roteiro, ainda sem medição do piloto."
    impact_value: "O avanço do assistente passou a depender de critério escrito, e não de impressão sobre a qualidade das respostas."
    related_projects: ["omnichannel", "lorentz-supervisor"]

  - id: "DEV-2026-089"
    date: "2026-06-22"
    title: "Polyrepo a partir de um monorepo com 25 repositórios embutidos pede dois caminhos"
    category: "devops"
    tags: [git, subtree, filter-repo, polyrepo, github]
    slug: "polyrepo-de-monorepo-com-repositorios-embutidos"
    summary: "O monorepo local não tinha remoto próprio e guardava cerca de 25 repositórios embutidos sem .gitmodules. A migração usou subtree split para o que estava rastreado direto e renomeação para o que já tinha repositório."
    problem_statement: >
      Desktop VB.NET e C++, web PHP e Laravel e infraestrutura conviviam na mesma pasta, com necessidades de acesso diferentes.
      Faltava repartir por domínio sem perder histórico e sem misturar projetos de terceiros.
    key_learnings:
      - "Pasta rastreada direto sai com git subtree split e push para o repositório novo. Repositório embutido só precisa ser renomeado no GitHub, o que preserva histórico e cria redirecionamento."
      - "git filter-repo limpou o histórico do cliente desktop antes da publicação, removendo uma biblioteca de 77 MB."
      - "O nome desejado pode estar ocupado por um fork antigo na própria conta. Renomeie o fork antes, para liberar o nome ao servidor real."
      - "Projetos de terceiros não entram nos repositórios próprios nem são renomeados."
      - "Repositórios antigos sobrepostos ficam para decisão humana. Definir qual é o canônico não é tarefa de automação."
    code_snippet: |
      git subtree split --prefix=<pasta> -b export/<repo>
      git push https://github.com/<conta>/<repo>.git export/<repo>:main
    impact_value: "Cada componente passou a ter repositório privado próprio, com acesso controlado por domínio."
    related_projects: ["lorentz-client", "lorentz-omnichannel", "lorentz-docs"]

  - id: "DEV-2026-090"
    date: "2026-07-15"
    title: "Dois checkouts do mesmo produto divergiram em 1.425 arquivos, e só o hash mostrou"
    category: "devops"
    tags: [git, php, checkout, hash]
    slug: "checkouts-do-mesmo-produto-diferem-e-so-o-hash-mostra"
    summary: "Duas pastas do Supervisor pareciam variações pequenas uma da outra. Com a comparação por hash, ficou claro que nenhuma das duas podia ser tratada como cópia da outra."
    problem_statement: >
      Havia dois checkouts paralelos do Supervisor e dúvida sobre qual usar.
      Nomes de pasta e branch não diziam o que cada um continha.
    key_learnings:
      - "A comparação por MD5 achou cerca de 4.332 arquivos em comum, 1.425 deles com conteúdo diferente."
      - "Cada lado tinha funcionalidades que o outro não recebeu, então adotar um e apagar o outro perderia trabalho."
      - "O relatório entrou no repositório e as regras do agente passaram a apontar para ele, para evitar a repetição da dúvida a cada sessão."
    impact_value: "A escolha do checkout passou a ser feita com um relatório na mão, e não pelo nome da pasta."
    related_projects: ["lorentz-supervisor"]

  - id: "DEV-2026-091"
    date: "2026-07-31"
    title: "Correção feita às pressas na VPS volta ao laboratório por commit, sem perder o trabalho local"
    category: "devops"
    tags: [git, vps, php, deploy, hotfix]
    slug: "correcao-na-vps-volta-ao-laboratorio-por-commit"
    summary: "Para estabilizar a produção, houve ajustes feitos direto na VPS, enquanto o laboratório tinha centenas de arquivos em andamento. O caminho foi publicar pelo Git o que estava na VPS e guardar o trabalho local em branch antes de sincronizar."
    problem_statement: >
      A jornada foi do laboratório a uma VPS, depois a um ambiente Docker no WSL, depois a outra VPS, e por fim de volta ao laboratório para consolidar.
      Na volta, o código em produção e o laboratório já tinham andado por caminhos diferentes.
    key_learnings:
      - "Correção feita na VPS precisa virar commit lá e ir para o remoto. Fora do Git, a próxima atualização pode apagá-la."
      - "Antes de alinhar o laboratório com a produção, um branch guardou os 221 arquivos em andamento. Nada se perdeu no alinhamento."
      - "O produto não foi reescrito. É o mesmo código migrando de PHP 5.6.40 para 7.3.33, 7.4.33 e 8.2.26, e registrar essa linhagem evita tratar cada pasta como um sistema à parte."
      - "A regra ficou escrita: ajuste destinado à VPS nasce no checkout do laboratório, segue por push e chega ao servidor com git pull."
    code_snippet: |
      git switch -c lab-wip-pre-pull
      git add -A && git commit -m "wip: laboratório antes de alinhar com a VPS"
      git switch lorentz-vps && git pull --ff-only
    impact_value: "O laboratório voltou a coincidir com a produção, com o trabalho anterior recuperável em branch próprio."
    related_projects: ["lorentz-supervisor", "lorentz-vps-stack"]

  - id: "DEV-2026-092"
    date: "2026-07-31"
    title: "Produto novo que parece variação de outro entra como irmão, sobre um núcleo comum"
    category: "arquitetura"
    tags: [iot, arquitetura, produto, monolito]
    slug: "produto-irmao-sobre-nucleo-comum-sem-clonar-monolito"
    summary: "Automação de hotel parecia uma extensão natural do sistema de energia. A decisão foi criar um produto irmão sobre um núcleo de IoT compartilhado, sem renomear nem clonar o monólito."
    problem_statement: >
      O Lorentz Energy é um produto B2B de contas e indicadores tarifários, em PHPMaker, e o novo pedido envolvia dispositivos em campo.
      Os atalhos eram trocar os rótulos do Energy para Hotel ou clonar o monólito. As duas opções foram rejeitadas e ficaram registradas no desenho.
    key_learnings:
      - "O Energy segue como produto de contas e KPIs. O núcleo novo é lorentz-iot, com lorentz-hotel como vertical em cima dele."
      - "A opção aprovada desenvolve IoT e Hotel em paralelo, com sprints separados."
      - "A ponte com o Energy é opcional e fica só para a fase 3, o que mantém os produtos separados até lá."
      - "O primeiro teste de campo é uma bomba e uma boia em casa, controladas pelo celular através da VPS, e serve também de vitrine para o eletricista e a diretoria."
    impact_value: "Os dois produtos podem evoluir separados e dividir só o que de fato é comum."
    related_projects: ["lorentz-iot", "lorentz-hotel", "lorentz-energy"]

  - id: "DEV-2026-093"
    date: "2026-08-01"
    title: "O ID válido da licença é o que o executável daquela máquina grava, não o da ferramenta do lab"
    category: "telefonia"
    tags: [ura, licenca, vbnet, campo]
    slug: "id-da-licenca-e-o-que-o-executavel-grava"
    summary: "Na visita a campo, a licença gerada com a ferramenta do laboratório foi recusada, embora o procedimento estivesse certo. O binário em produção era de outro build e calculava outro ID."
    problem_statement: >
      A URA instalada registrou 'Licença inválida ID Local' com uma licença gerada a partir do ID impresso pela ferramenta do lab.
      O executável em produção tinha gravado no INI um ID começando em 1970, diferente do valor que a ferramenta mostrava.
    key_learnings:
      - "Gerada de novo com o ID que aquele executável gravou no INI, a licença passou a mostrar 'Licença OK' no log."
      - "ID de máquina começando em 19700101 é sintoma de data de instalação zerada ou anormal naquele build."
      - "Ferramenta de apoio e produto precisam vir do mesmo build. Em campo, consulte a versão e o tamanho do binário instalado antes de gerar a licença."
      - "Na versão seguinte, data zerada ou ausente passou a dar falha explícita, em vez de gerar um ID enganoso, e o código morto de WMIC saiu."
    impact_value: "A licença de campo passou a ser gerada a partir do que o binário instalado informa."
    related_projects: ["ura", "ura-dtmf-lab"]

  - id: "DEV-2026-094"
    date: "2026-08-06"
    title: "Capacidade de IoT se define em patamares, antes do primeiro cliente em produção"
    category: "arquitetura"
    tags: [iot, capacidade, teste-de-carga, planejamento]
    slug: "capacidade-de-iot-definida-em-patamares"
    summary: "O desenho inicial dizia o que construir, mas não até quantos dispositivos ele aguentaria. O plano de expansão fixou três patamares, com limites e o que precisa estar pronto para passar de um ao outro."
    problem_statement: >
      Um laboratório com poucos dispositivos não diz nada sobre uma pousada inteira ou uma rede delas.
      Sem limites escritos, o primeiro cliente real seria também o primeiro teste de carga.
    key_learnings:
      - "L0, laboratório: até 10 dispositivos. L1, uma pousada: até 80 dispositivos e 20 req/s de ingestão. L2, rede: até 500 dispositivos e 100 req/s. São metas de projeto, ainda não medidas."
      - "O limite inclui latência: p95 de ingestão abaixo de 200 ms em L1 e de 300 ms em L2, para um servidor lento não passar por aprovado."
      - "O bloqueio seguinte ficou explícito: limite de requisições, token por dispositivo e retenção, depois MariaDB, e teste de carga antes da primeira pousada."
