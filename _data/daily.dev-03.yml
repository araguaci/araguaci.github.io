  - id: "DEV-2026-047"
    date: "2026-06-23"
    title: "Atualizar o cliente Windows sem pedir administrador"
    category: "windows"
    tags: [inno-setup, dotnet, atualizacao, seguranca]
    slug: "auto-update-cliente-windows-sem-administrador"
    summary: "O instalador gravava em Arquivos de Programas e o atualizador falhava para o operador sem elevação. A pasta do aplicativo passou a permitir modificação pelos usuários, e o INI da empresa saiu do Git."
    problem_statement: >
      Cada build novo pedia UAC porque o updater não conseguia trocar o exe em Program Files.
      O script de publicação ainda esbarrava no lock do compartilhamento de rede, e um INI
      com dados da empresa tinha caído na árvore versionada.
    key_learnings:
      - "Permissão Modify para Users na pasta {app} deixa o updater trocar exe e dll sem elevação."
      - "O publish recusa gravar de novo a mesma versão. Isso evita manifesto apontando para binário trocado em silêncio."
      - "A pasta deploy, com o INI da empresa, fica no gitignore."
      - "Lock no share de rede pede nova tentativa no script, não um segundo clique manual."
    code_snippet: |
      ; Inno Setup: a pasta do app pode ser atualizada pelo operador
      [Dirs]
      Name: "{app}"; Permissions: users-modify

      ; Não versionar
      ; deploy/
    impact_value: "A estação recebe a build nova sem UAC e a configuração da empresa deixa o repositório."
    related_projects: ["omnichannel", "LorentzCliente"]

  - id: "DEV-2026-048"
    date: "2026-04-24"
    title: "Firstboot em Python 2.7: acento sem cabeçalho de encoding derruba o EL7"
    category: "devops"
    tags: [python, issabel, centos, utf-8, docker]
    slug: "firstboot-python27-encoding-utf8-el7"
    summary: "O CentOS 7 do Issabel ainda roda Python 2.7 no primeiro boot. Um snippet com caractere fora de ASCII, sem declaring encoding, interrompe a provisão antes do PBX subir."
    problem_statement: >
      Comentários e mensagens em português dentro do firstboot eram UTF-8. O interpretador
      2.7 do EL7 recusa o arquivo sem o cookie de encoding e o container reinicia no meio
      da configuração, com AMI e Apache ainda fora.
    key_learnings:
      - "No Python 2.7, arquivo com acento precisa da linha coding utf-8 logo no topo."
      - "O mesmo texto é inofensivo no Python 3 do restante do stack. O firstboot é o ponto que ainda é 2.7."
      - "Mensagem de boot em ASCII evita a classe inteira de falha quando o cookie é esquecido."
      - "Login de agente de call center e a porta HTTPS de produção foram estabilizados no mesmo ciclo: o boot tem que terminar para o restante ser testável."
    code_snippet: |
      # -*- coding: utf-8 -*-
      # EL7 / Python 2.7: sem esta linha, acento no snippet aborta o firstboot.
      print("Issabel firstboot ok")
    impact_value: "O primeiro boot do PBX deixa de morrer num comentário em português."
    related_projects: ["issabel4-docker", "lorentz-vps-stack"]
