  summary: Metodologia de coleta de evidências cívicas e investigativas imutáveis
    com ancoragem criptográfica de integridade e espelhamento distribuído.
  problem_statement: Investigações de supersalários, atos administrativos controversos
    e diários oficiais sofrem com apagamento deliberado de links e alterações silenciosas
    na fonte original.
  key_learnings:
  - O cálculo imediato de hash SHA-256 no momento do scraping cria um selo matemático
    imutável que comprova que o arquivo não sofreu adulteração posterior.
  - O arquivamento permanente via IPFS (InterPlanetary File System) e Web Archive
    confere redundância distribuída imune a censura ou quedas de servidores.
  - A estruturação dos dados sob licença Creative Commons Zero (CC0) protege o ecossistema
    contra ameaças de intimidação jurídica por alegações de direitos autorais.
  code_snippet: "# Geração de selo de integridade SHA-256 para dossiês cívicos\nimport\
    \ hashlib, json\n\ndef anchor_evidence(file_path):\n    sha = hashlib.sha256()\n\
    \    with open(file_path, 'rb') as f:\n        while chunk := f.read(65536):\n\
    \            sha.update(chunk)\n    evidence_receipt = {\n        'file': file_path,\n\
    \        'sha256': sha.hexdigest(),\n        'license': 'CC0-1.0 Public Domain'\n\
    \    }\n    return evidence_receipt\n"
  impact_value: Transparência pública radical e preservação histórica de provas para
