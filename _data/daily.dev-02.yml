- id: DEV-2026-023
  date: '2026-09-24'
  title: 'Pipeline Unificado de Currículo Soberano: De YAML Único para JSON Resume,
    Markdown e PDF'
  category: devops
  tags:
  - json-resume
  - yaml
  - python
  - weasyprint
  - automacao
  - cv
  slug: pipeline-unificado-curriculo-soberano-yaml-json-markdown-pdf
  summary: Automação editorial baseada em Single Source of Truth que compila dados
    profissionais em JSON Schema internacional, Markdown para GitHub e PDF de alta
    precisão.
  problem_statement: A manutenção manual de currículo e portfólio contendo 30+ anos
    de experiência e 56 projetos em diversas plataformas causava dispersão de dados,
    erros de datas e trabalho duplicado.
  key_learnings:
  - O formato resume.yml como fonte única de verdade centraliza competências, histórico
    de empresas e publicações, desacoplando o conteúdo da apresentação.
  - A conformidade estrita com o padrão JSON Resume permite integração instantânea
    com motores de busca e analisadores de recrutamento (ATS).
  - 'A geração headless de PDF via HTML5 com regras de CSS Paged Media (@page { size:
    A4; margin: 15mm; }) garante paginação perfeita sem cortes em blocos de texto.'
  code_snippet: "# Script de orquestração de formatos de currículo\nimport yaml, json,\
    \ subprocess\n\ndef sync_resume_ecosystem():\n    with open('_data/resume.yml',\
    \ 'r', encoding='utf-8') as f:\n        data = yaml.safe_load(f)\n    with open('_data/resume.json',\
    \ 'w', encoding='utf-8') as f:\n        json.dump(data, f, ensure_ascii=False,\
    \ indent=2)\n    # Compilação para PDF via Chrome Headless\n    subprocess.run(['pwsh',\
    \ '-Command', 'node scripts/render_pdf.js'])\n"
  impact_value: Atualização de portfólio e currículo em múltiplos formatos em menos
    de 5 segundos a partir de um único commit.
  related_projects:
  - artesdosul.com/curriculo
  - araguaci.github.io
- id: DEV-2026-024
  date: '2026-08-25'
  title: 'Engenharia de Micro-Aplicações Criativas: Algoritmos de Delaunay e Canvas
    Generativo (Polygonize 3D)'
  category: frontend
  tags:
  - canvas
  - delaunay
  - procedural
  - web-graphics
  - math
  - javascript
  slug: micro-aplicacoes-criativas-delaunay-canvas-polygonize
  summary: Geração procedimental de malhas poligonais e arte computacional no cliente
    com Triangulação de Delaunay e otimização de renderização com TypedArrays.
  problem_statement: Renderizar dezenas de milhares de polígonos interativos a partir
    de fotografias do usuário diretamente no browser provocava travamento da thread
    principal e alto consumo de memória.
  key_learnings:
  - A Triangulação de Delaunay sobre pontos distribuídos por algoritmo de Poisson
    Disk produz malhas orgânicas sem arestas agudas e finas indesejadas.
  - O uso de TypedArrays (Float32Array) para coordenadas e Uint32Array para índices
    reduz o overhead de alocação de objetos em mais de 75%.
  - O cálculo de cor média por centróide do triângulo amostrando diretamente a imagem
    de fundo via getImageData viabiliza exportação vetorial de fidelidade artística.
  code_snippet: "// Renderização otimizada de triângulos Delaunay em Canvas 2D\nfunction\
    \ renderMesh(ctx, vertices, triangles, colors) {\n  for (let i = 0; i < triangles.length;\
    \ i += 3) {\n    const p0 = triangles[i] * 2, p1 = triangles[i+1] * 2, p2 = triangles[i+2]\
    \ * 2;\n    ctx.fillStyle = colors[i / 3];\n    ctx.beginPath();\n    ctx.moveTo(vertices[p0],\
    \ vertices[p0 + 1]);\n    ctx.lineTo(vertices[p1], vertices[p1 + 1]);\n    ctx.lineTo(vertices[p2],\
    \ vertices[p2 + 1]);\n    ctx.closePath();\n    ctx.fill();\n  }\n}\n"
  impact_value: Suíte de webapps criativos aberta, fluida e com processamento 100%
    no navegador sem envio de fotos a servidores remotos.
  related_projects:
  - polygonize-3d
  - chromamesh
  - glitchlab
- id: DEV-2026-025
  date: '2026-08-22'
  title: 'Visualização Sonora Reativa em Tempo Real: FFT e Web Audio API no AudioVisualizer
    3D'
  category: frontend
  tags:
  - web-audio
  - fft
  - visualizer
  - audio-reactive
  - javascript
  slug: visualizacao-sonora-reativa-fft-web-audio-api
  summary: Arquitetura de processamento espectral de frequências sonoras com AnalyserNode
    e deformação de malha tridimensional em 60 FPS com interpolação linear.
  problem_statement: Visualizadores sonoros tradicionais na web sofrem com atrasos
    entre a batida sonora e a resposta gráfica, além de trepidação excessiva nos eixos
    geométricos.
  key_learnings:
  - O nó AnalyserNode com fftSize de 2048 e smoothingTimeConstant de 0.85 amortece
    o ruído espectral e preserva a definição dos transientes de graves.
  - A segmentação das bandas em Graves (20-250Hz), Médios (250-4000Hz) e Agudos (4k-20kHz)
    permite modular propriedades gráficas distintas (escala, cor e rotação).
  - A técnica de LERP (Linear Interpolation) aplicada aos vetores de transição gráfica
    elimina artefatos visuais de salto abrupto entre frames.
  code_snippet: "// Processamento espectral de frequência e interpolação linear\n\
    const analyser = audioCtx.createAnalyser();\nanalyser.fftSize = 2048;\nanalyser.smoothingTimeConstant\
    \ = 0.85;\nconst freqData = new Uint8Array(analyser.frequencyBinCount);\n\nfunction\
    \ animate() {\n  requestAnimationFrame(animate);\n  analyser.getByteFrequencyData(freqData);\n\
    \  let bassAvg = 0;\n  for (let i = 0; i < 30; i++) bassAvg += freqData[i];\n\
    \  bassAvg /= 30;\n  const targetScale = 1.0 + (bassAvg / 255.0) * 1.5;\n  currentScale\
    \ += (targetScale - currentScale) * 0.15; // LERP\n}\n"
  impact_value: Experiência audiovisual envolvente no navegador para meditação, estudo
    frequencial e estúdios musicais.
  related_projects:
  - audioviz-3d
  - gaia.artesdosul.com
- id: DEV-2026-026
  date: '2026-08-14'
  title: Governança de Metadados e Prevenção de Erros 404 em Tag Clouds no Jekyll
    Estático
  category: devops
  tags:
  - jekyll
  - metadata
  - taxonomy
  - safe-mode
  - github-pages
  slug: governanca-metadados-prevencao-erros-404-tag-clouds-jekyll
  summary: Estratégia de normalização taxonômica e criação de coleções seguras no
    Jekyll para evitar links quebrados em nuvens de tags geradas no GitHub Pages.
  problem_statement: No Safe Mode do GitHub Pages, a ausência de plugins de terceiros
    para criação automática de arquivos de tags gerava links para rotas inexistentes
    e erros 404 ao clicar em tags livres.
  key_learnings:
  - A definição de um arquivo canônico _featured_tags ou dicionário de whitelist garante
    que apenas tags com páginas de destino declaradas recebam hyperlinks.
  - 'O filtro Liquid slugify: "latin" deve ser aplicado universalmente para uniformizar
    diacríticos e evitar falhas de codificação UTF-8 entre sistemas operacionais.'
  - Testes automatizados de integridade estática no CI detectam nós órfãos antes da
    sincronização dos builds.
  code_snippet: "<!-- Nuvem de tags resiliente com verificação de existência -->\n\
    {% for tag in site.tags %}\n  {% assign tag_slug = tag[0] | slugify: \"latin\"\
    \ %}\n  {% if site.data.featured_tags contains tag_slug %}\n    <a href=\"/tags/{{\
    \ tag_slug }}/\" class=\"tag-badge\">{{ tag[0] }} ({{ tag[1].size }})</a>\n  {%\
    \ else %}\n    <span class=\"tag-badge tag-plain\">{{ tag[0] }}</span>\n  {% endif\
    \ %}\n{% endfor %}\n"
  impact_value: Eliminação de 100% dos links quebrados em taxonomias de projetos e
    conformidade total com os padrões do GitHub Pages.
  related_projects:
  - artesdosul
  - araguaci.github.io
- id: DEV-2026-027
  date: '2026-07-20'
  title: 'Orquestração de Agentes com MCP (Model Context Protocol): O Fim dos Scripts
    Ad-Hoc'
  category: ia
  tags:
  - mcp
  - llm
  - agentes
  - automacao
  - composio
  - tool-use
  slug: orquestracao-agentes-mcp-model-context-protocol
  summary: Padronização da integração de agentes autônomos com APIs corporativas (Google
    Drive, WhatsApp, Git) via especificação aberta Model Context Protocol.
  problem_statement: Pipelines de automação com LLMs construídas sobre scripts pontuais
    de terceiros quebravam constantemente com qualquer alteração de payload ou cabeçalhos
    de autenticação.
  key_learnings:
  - O protocolo MCP (Model Context Protocol) provê uma camada de transporte RPC tipada
    e estável entre o modelo e os recursos externos.
  - O isolamento de chaves de API e tokens de autenticação em servidores MCP dedicados
    protege credenciais contra vazamentos em históricos e contextos de LLM.
  - Validações formais com JSON Schema em ferramentas MCP reduzem drasticamente respostas
    com alucinação de argumentos ou tipos incompatíveis.
  code_snippet: "{\n  \"mcpServers\": {\n    \"github\": {\n      \"command\": \"\
    npx\",\n      \"args\": [\"-y\", \"@modelcontextprotocol/server-github\"],\n \
    \     \"env\": { \"GITHUB_PERSONAL_ACCESS_TOKEN\": \"***\" }\n    },\n    \"filesystem\"\
    : {\n      \"command\": \"npx\",\n      \"args\": [\"-y\", \"@modelcontextprotocol/server-filesystem\"\
    , \"D:\\\\artesdosul\"]\n    }\n  }\n}\n"
  impact_value: Infraestrutura de pair programming e automação com agentes autônomos
    robusta, modular e imune a breaking changes de APIs.
  related_projects:
  - artesdosul
  - central-de-agentes
- id: DEV-2026-028
  date: '2026-07-10'
  title: 'Estratégia Editorial para X Articles: Long-Forms Técnicos sem Ruído de Threads'
  category: conteudo
  tags:
  - xcom
  - copywriting
  - editorial
  - markdown
  - content-strategy
  slug: estrategia-editorial-x-articles-long-forms-sem-ruido
  summary: Metodologia de conversão e polimento de documentos técnicos complexos para
    publicação no formato longo nativo do X (Twitter Articles) com máxima retenção.
  problem_statement: Threads fragmentadas no X dispersavam a discussão técnica e geravam
    atrito cognitivo em artigos de engenharia densos com código e diagramas.
  key_learnings:
  - O formato nativo X Articles dispensa artifícios de paginação forçada como [1/20]
