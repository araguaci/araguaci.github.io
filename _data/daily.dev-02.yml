- id: DEV-2026-017
  date: '2026-09-30'
  title: 'Deploy Híbrido Resiliente: Sincronização Atômica via FTPS e Preservação
    de Artefatos Jekyll'
  category: devops
  tags:
  - devops
  - ftp
  - ci-cd
  - jekyll
  - vercel
  - python
  slug: deploy-hibrido-resiliente-sincronizacao-ftps-jekyll
  summary: Arquitetura de deploy contínuo multi-alvo sincronizando Vercel e servidores
    Linux via FTPS passivo com verificação atômica de integridade MD5 e proteção do
    diretório docs/.
  problem_statement: Em deploys híbridos em que o repositório alimenta simultaneamente
    Vercel (via docs/) e servidores web legados via FTPS, o comando jekyll build limpava
    recursivamente a pasta de destino, causando sobrescritas acidentais e truncamento
    de arquivos HTML em conexões passivas.
  key_learnings:
  - O Jekyll executa limpeza implícita no diretório destino se parâmetros de destination
    não forem rigidamente isolados; backups em staging pré-deploy evitam perda de
    assets compilados.
  - Sockets FTPS passivos requerem transmissão em chunks moderados (8192 bytes) com
    mecanismo de retry exponencial com jitter para blindagem contra oscilações de
    rota.
  - Verificação de integridade pós-upload confrontando hashes MD5 locais com comandos
    de tamanho/checksum no servidor FTP elimina transferências truncadas antes da
    entrada em produção.
  code_snippet: "# Script de deploy FTPS atômico com verificação de integridade\n\
    import ftplib, os, hashlib\n\ndef upload_atomic(ftp, local_file, remote_file):\n\
    \    chunk_size = 8192\n    with open(local_file, 'rb') as f:\n        ftp.storbinary(f'STOR\
    \ {remote_file}', f, chunk_size)\n    remote_size = ftp.size(remote_file)\n  \
    \  local_size = os.path.getsize(local_file)\n    if remote_size != local_size:\n\
    \        raise IOError(f'Truncamento detectado: {local_size} vs {remote_size}')\n"
  impact_value: Zero downtime e eliminação de 100% dos incidentes de páginas truncadas
    em deploys do portal artesdosul.com.
  related_projects:
  - artesdosul.com
  - artesdosul.github.io
- id: DEV-2026-018
  date: '2026-09-29'
  title: 'Engenharia de Hero Images de Alto Impacto: Conversão WebP Lossless e Formato
    5:2 para X Articles'
  category: frontend
  tags:
  - webp
  - design
  - performance
  - pillow
  - xcom
  - seo
  slug: engenharia-hero-images-webp-proporcao-5-2-x-articles
  summary: Pipeline automatizado de geração, corte áureo e compressão de imagens de
    capa em formato estrito 5:2 para X Articles e webapps de altíssimo desempenho.
  problem_statement: Banners heróicos de artigos gerados em resoluções arbitrárias
    sofriam cortes agressivos em telas mobile e no leitor de X Articles, além de estourarem
    orçamentos de performance (LCP) com imagens de mais de 3.5MB.
  key_learnings:
  - A proporção 5:2 (e.g. 1200x480px ou 2500x1000px) é a métrica geométrica ideal
    para headers do X Articles sem perdas em safe-zones centrais.
  - A compressão WebP com quality=85 e método de esforço 6 no Pillow entrega economia
    de até 88% de tráfego mantendo fidelidade de contraste tipográfico WCAG AAA.
  - A declaração estrita de metadados og:image:width e og:image:height no frontmatter
    previne saltos de layout (CLS) na renderização de snippets em mensageiros e redes
    sociais.
  code_snippet: "from PIL import Image\n\ndef optimize_hero_image(src_path, dest_path,\
    \ target_ratio=(5, 2)):\n    with Image.open(src_path) as img:\n        w, h =\
    \ img.size\n        target_w = w\n        target_h = int(w * (target_ratio[1]\
    \ / target_ratio[0]))\n        if target_h > h:\n            target_h = h\n  \
    \          target_w = int(h * (target_ratio[0] / target_ratio[1]))\n        left\
    \ = (w - target_w) // 2\n        top = (h - target_h) // 2\n        cropped =\
    \ img.crop((left, top, left + target_w, top + target_h))\n        cropped.save(dest_path,\
    \ 'WEBP', quality=85, method=6)\n"
  impact_value: Redução de 85% do payload de mídia em 56 portais e pontuação 100 de
    SEO no Google Lighthouse.
  related_projects:
  - artesdosul
  - guias.artesdosul.com
  - xcom-articles
- id: DEV-2026-019
  date: '2026-09-29'
  title: 'Design de Interface Devocional & Decodificação Interativa: A Sagrada Medalha
    de São Bento (CSSML PWA)'
  category: frontend
  tags:
  - pwa
  - css-grid
  - svg
  - audio-api
  - ux
  - devocional
  slug: interface-devocional-decodificacao-interativa-cssml-pwa
  summary: Modelagem de Progressive Web App devocional interativo com decodificador
    SVG em tempo real de siglas latinas da Cruz Sagrada e oração com áudio gregoriano.
  problem_statement: A Medalha de São Bento possui inscrições criptográficas latinas
    históricas (C.S.P.B., C.S.S.M.L., N.D.S.M.D., V.R.S.N.S.M.V., S.M.Q.L.I.V.B.)
    de difícil assimilação pelo fiel sem um mapa interativo conectado.
  key_learnings:
  - Mapeamento vetorial SVG com atributos data-sigla e event delegation viabiliza
    interação tátil suave em qualquer resolução de tela.
  - Estruturação de CSS Grid em 3 colunas (3x3) para viewports desktop (>= 1200px)
    proporciona simetria sagrada e harmonia estética minimalista.
  - A integração de canto gregoriano via Web Audio API deve implementar desbloqueio
    por gesto explícito do usuário, respeitando as políticas modernas de autoplay
    dos browsers.
  code_snippet: "/* Grid 3x3 balanceado para decodificador de siglas */\n.siglas-grid\
    \ {\n  display: grid;\n  grid-template-columns: repeat(auto-fit, minmax(280px,\
    \ 1fr));\n  gap: 1.5rem;\n}\n@media (min-width: 1200px) {\n  .siglas-grid {\n\
    \    grid-template-columns: repeat(3, 1fr);\n  }\n}\n.sigla-card {\n  backdrop-filter:\
    \ blur(12px);\n  background: rgba(18, 22, 34, 0.75);\n  border: 1px solid rgba(212,\
    \ 175, 55, 0.25);\n  border-radius: 12px;\n  transition: transform 0.2s ease,\
    \ border-color 0.2s ease;\n}\n"
  impact_value: Criação de plataforma soberana de oração com mais de 100% de disponibilidade
    offline e fidelidade teológica rigorosa.
  related_projects:
  - cssml.artesdosul.com
  - arcanjos.artesdosul.com
- id: DEV-2026-020
  date: '2026-09-28'
  title: 'Engenharia Reversa Psicológica: O Playbook do Manipulador como PWA Educativo
    Offline-First'
  category: frontend
  tags:
  - pwa
  - offline-first
  - dark-psychology
  - search-index
  - service-worker
  slug: engenharia-reversa-psicologica-playbook-manipulador-pwa
  summary: Desenvolvimento de aplicação de referência sobre psicologia comportamental
    e desarmamento de táticas manipulativas com motor de busca local e funcionamento
    offline total.
  problem_statement: Bases conceituais de psicologia escura e táticas de defesa comunicacional
    são volumosas e frequentemente pesquisadas em situações de campo onde o acesso
    à rede é instável ou monitorado.
  key_learnings:
  - Estratégia CacheFirst em Service Worker assegura carregamento sub-50ms e privacidade
    absoluta das consultas do usuário sem envio de telemetria.
  - Indexação de busca em memória via tokens de trigramas (fuzzy search) possibilita
    localizar padrões de manipulação mesmo com digitação aproximada.
  - Sinalização de cores com contraste tático (alerta vermelho, defesa azul, contexto
    cinza) melhora a taxa de compreensão sob estresse cognitivo.
  code_snippet: "// Service Worker: Cache agressivo para base de conhecimento soberana\n\
    const CACHE_NAME = 'playbook-v1.2';\nself.addEventListener('fetch', (event) =>\
    \ {\n  event.respondWith(\n    caches.match(event.request).then((cachedResponse)\
    \ => {\n      if (cachedResponse) return cachedResponse;\n      return fetch(event.request).then((networkResponse)\
    \ => {\n        return caches.open(CACHE_NAME).then((cache) => {\n          cache.put(event.request,\
    \ networkResponse.clone());\n          return networkResponse;\n        });\n\
    \      });\n    })\n  );\n});\n"
  impact_value: Disponibilização de ferramenta educativa aberta de proteção cívica
    contra persuasão desonesta e gaslighting corporativo.
  related_projects:
  - persuasao.artesdosul.com
  - artesdosul.com
- id: DEV-2026-021
  date: '2026-09-27'
  title: 'Cartografia de Saúde Holística & Medicina Integrativa: O PWA Mapa da Cura
    e Frequências Rife'
  category: frontend
  tags:
  - pwa
  - medicina-integrativa
  - svg
  - tooltips
  - saude-digital
  slug: cartografia-saude-holistica-pwa-mapa-da-cura-frequencias
  summary: Construção de bússola terapêutica interativa em SVG para fitoterapia, biofísica
    e frequências sonoras integrativas com compartilhamento social via WhatsApp.
  problem_statement: A navegação em manuais extensos de práticas integrativas gerava
    fadiga no paciente e impossibilidade de prescrição compartilhada rápida com familiares.
  key_learnings:
  - Cálculo de coordenadas polares (raio, seno, cosseno) para posicionamento de nós
    em rosa-dos-ventos SVG garante escalabilidade visual matemática perfeita.
  - 'Tooltips desacoplados com position: fixed e cálculo de bounding-rect previnem
    cortes causados por wrappers com overflow: hidden.'
  - Codificação direta de roteiros e prescrições em URLs wa.me viabiliza encaminhamento
    de guias de saúde sem intermediários ou bancos de dados.
  code_snippet: "// Posicionamento trigonométrico em SVG da Rosa da Cura\nfunction\
    \ getPointOnCircle(cx, cy, r, angleInDegrees) {\n  const rad = (angleInDegrees\
    \ - 90) * Math.PI / 180.0;\n  return {\n    x: cx + (r * Math.cos(rad)),\n   \
    \ y: cy + (r * Math.sin(rad))\n  };\n}\n"
  impact_value: Democratização do acesso a guias de autocuidado e conexão direta de
    pacientes com abordagens de bem-estar natural.
  related_projects:
