    Access) transfere buffers de imagem sem consumir ciclos de processamento de CPU.
  - Estratégias de gerenciamento de energia com Light Sleep e redução dinâmica de
    frequência de 240MHz para 80MHz quadruplicam a autonomia da bateria em campo.
