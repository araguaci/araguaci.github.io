entries:
  - id: "DEV-2026-063"
    date: "2026-10-04"
    title: "O tronco SIP falha quando o nome e o id não compartilham collation"
    category: "telefonia"
    tags: [asterisk, mysql, issabel, sip, chan-sip]
    slug: "tronco-sip-collation-e-registro-atrasado"
    summary: "Gravar o tronco pelo provisionador oficial quebrava no MySQL com mistura de collation entre trunks.name e sip.id. A comparação passou a usar o collation de cada coluna, e o registro no Asterisk só é confiável segundos depois do reload."
    problem_statement: >
      O INSERT do provisionador morria com ERROR 1267 (illegal mix of collations)
      na comparação name = @nome. trunks.name estava em utf8_unicode_ci e sip.id
      em utf8mb4_unicode_ci, com a conexão em utf8_general_ci. O relatório do
      marketplace respondia 403 e parecia ser a causa. O plano gerado chamava
      o script com exec, e a sessão SSH fechava junto com o processo. Logo após
      o sip reload, sip show registry ainda dizia Unregistered.
    key_learnings:
      - "O charset do CONVERT é a parte da collation antes do primeiro underscore (utf8mb4_unicode_ci vira utf8mb4). A cláusula fica CONVERT(coluna USING charset) COLLATE collation, lida de information_schema para trunks.name e sip.id."
      - "Sem o arquivo de token o tronco ainda é gravado. O 403 do marketplace é a recusa do relatório, não a falha do peer."
      - "exec substitui o shell. O plano de provisionamento tem de ser um bash normal, senão a sessão remota acaba quando o script termina."
      - "Este Issabel usa chan_sip. A tabela asterisk.pjsip não existe, então o driver não pode assumir PJSIP."
      - "amportal reload não regenerou sip_additional.conf. O caminho que gravou o peer foi retrieve_conf e depois sip reload. A saída do retrieve_conf imprime a senha do banco e vai para /dev/null."
      - "Unregistered contém o texto registered. O diagnóstico só conta Registered com limite de palavra, e a primeira leitura depois do reload ainda pode ser Unregistered."
    code_snippet: |
      # collation vem de information_schema; charset é o trecho antes do _
      # trunks.name e sip.id não compartilham a mesma collation
      CONVERT(`name` USING utf8mb4) COLLATE utf8mb4_unicode_ci
        = CONVERT(@nvoip_trunk_name USING utf8mb4) COLLATE utf8mb4_unicode_ci
    impact_value: "O tronco passa a ser gravado no Issabel 4 e o diagnóstico só marca registrado quando o registry diz Registered de fato."
    related_projects: ["lorentz-vps-stack"]

  - id: "DEV-2026-064"
    date: "2026-10-04"
    title: "Ramal que só existe em arquivo de peer não aparece na lista do Issabel"
    category: "telefonia"
    tags: [asterisk, issabel, sip, php, chan-sip]
    slug: "ramal-issabel-users-devices-e-codigo-411"
    summary: "Peers em arquivo customizado registram no Asterisk e não entram na tela de extensões. A lista lê users, devices e sip, e o ramal 411 ainda colidia com o código de facilidade da lista telefônica."
    problem_statement: >
      A tela de extensões estava vazia mesmo com peers no sip show peers.
      O cadastro em sip_lab_peers.conf e sip_ura_peers.conf não cria linha em
      users. core_users_add imprimia ERROR: this state should not exist duas
      vezes por ramal. Em Feature Codes aparecia o aviso de conflito entre
      código de facilidade e número de ramal.
    key_learnings:
      - "A GUI do Issabel lista users + devices + sip. Peer só em sip_*_custom.conf existe para o Asterisk e não para o pbxadmin."
      - "core_users_add exige ringtimer inteiro (0, não string vazia). callwaiting e pinless têm de ser enabled ou disabled. Sem isso a função escreve ERROR: this state should not exist."
      - "Um lote seguinte que só atualiza o nome não entra de novo em core_users_add, então não corrige callwaiting já gravado vazio."
      - "O conflito era o defaultcode 411 de pbdirectory (app-pbdirectory) contra o ramal 411. featurecodeadmin usa customcode quando preenchido. customcode *411 libera o ramal e mantém a lista telefônica."
      - "O bootstrap do script é require de /etc/issabelpbx.conf com issabelpbx_auth desligado. Senha de ramal fica em arquivo modo 600 e não sai no stdout."
    code_snippet: |
      UPDATE featurecodes
      SET customcode = '*411'
      WHERE modulename = 'pbdirectory'
        AND featurename = 'app-pbdirectory';
    impact_value: "Os ramais do laboratório passam a aparecer em Extensões, e o aviso de conflito de código de facilidade some sem renumerar o ramal 411."
    related_projects: ["lorentz-vps-stack"]

  - id: "DEV-2026-065"
    date: "2026-10-04"
    title: "A lista da direita do Issabel some no fundo branco do jQuery UI"
    category: "frontend"
    tags: [css, jquery, issabel, tema]
    slug: "menu-rnav-jquery-ui-fundo-branco"
    summary: "O menu .rnav herdava background white do jQuery UI enquanto o tema pintava o link com cor clara. A regra que escurecia o painel do operador não alcançava esse menu."
    problem_statement: >
      Os itens do ul da sidebar direita deixavam de ser lidos na tela de
      extensões. O inspetor mostrava .rnav .ui-widget-content e
      ul.ui-menu.ui-widget.ui-widget-content com background white.
      O miolo do painel de operador também ficava branco, vindo do body
      em neon-core.css. apachectl graceful dentro do container falhava
      ao procurar o D-Bus.
    key_learnings:
      - "O jQuery UI em libs/js/jquery/css define .ui-widget-content com background white. O tema usa cor clara em body a, então o texto do .rnav some no branco."
      - ".neo-module-content .ui-widget-content escurece o miolo do módulo e também qualquer widget dentro dele. O .rnav pode ficar fora desse seletor, e a especificidade de .ui-menu.ui-widget.ui-widget-content mantém o branco."
      - "A correção é regra própria em .rnav, .rnav .ui-widget-content e .rnav .ui-menu, com fundo da superfície escura e texto primário, inclusive no item ativo."
      - "neon-core.css ainda declara body com background #ffffff. Sem cobertura no módulo, o canvas do painel de operador volta ao branco."
      - "No container, apachectl graceful falha com Failed to get D-Bus connection. httpd -k graceful recarrega o Apache."
    code_snippet: |
      .rnav,
      .rnav .ui-widget-content,
      .rnav .ui-menu.ui-widget-content {
        background: var(--lo-surface-2) !important;
        color: var(--lo-text-primary) !important;
      }
    impact_value: "A lista de ramais da direita volta a ser legível no tema escuro, sem desfazer o fundo do painel de operador."
    related_projects: ["lorentz-vps-stack"]

  - id: "DEV-2026-066"
    date: "2026-10-04"
    title: "O Issabel 5 do laboratório não ocupa o lugar do container Issabel 4"
    category: "infraestrutura"
    tags: [issabel, docker, hyper-v, windows, ssh]
    slug: "issabel5-vm-nao-substitui-container"
    summary: "A stack oficial continua com Issabel 4 em Docker. O Issabel 5 entra como VM quando a máquina já o tem ou quando se quer a versão nova, e os dois não podem publicar 5060 e 443 no mesmo host."
    problem_statement: >
      O laboratório Windows subiu Issabel 5 numa VM Hyper-V e a pergunta
      foi se a stack inteira deveria ir para Docker no mesmo host, inclusive
      o container do PBX. O SSH do host abria cmd.exe, onde ls não existe.
      A chave de administrador não era lida do authorized_keys do usuário.
      Sincronizar a pasta do notebook para o mini PC levava .git, .env e o
      token do tronco se o ignore não estivesse explícito.
    key_learnings:
      - "Issabel 4 no container é o artefato da stack. Issabel 5 é ISO na VM. O monitor escolhe o alvo. Servidor, supervisão e manutenção são os mesmos."
      - "Subir o container issabel no host que já tem a VM do Issabel 5 disputa SIP 5060 e HTTPS 443. O deploy de laboratório não chama o deploy desse container."
      - "OpenSSH no Windows, para conta de administrador, lê C:\\ProgramData\\ssh\\administrators_authorized_keys. A shell padrão vem de HKLM\\SOFTWARE\\OpenSSH DefaultShell. Sessão sem elevação não grava essa chave."
      - "O ignore da sincronização precisa excluir .git, .env, att_config.php e o arquivo de token do tronco. Copiar o .env do notebook para o laboratório mistura credencial."
      - "Há quatro shells. O notebook é o único com os aliases SSH. O host Windows fala PowerShell. A VM e a VPS falam bash. exit volta ao notebook."
    impact_value: "O laboratório valida o procedimento com Issabel 5 na VM e o restante da stack em Docker, sem derrubar as portas do PBX que já está no ar."
    related_projects: ["lorentz-vps-stack"]

  - id: "DEV-2026-067"
    date: "2026-10-04"
    title: "git pull na VPS não troca a imagem do monitor que já está no ar"
    category: "devops"
    tags: [docker, git, monitor, vps]
    slug: "git-pull-nao-reconstroi-imagem-do-monitor"
    summary: "O site mostrava a versão antiga do monitor com o Git já à frente. A imagem copia o código na build, e um pull com árvore suja nem chega a atualizar os arquivos."
    problem_statement: >
      O painel em produção continuava na versão anterior depois que o
      repositório remoto já tinha os commits novos. git pull abortou porque
      arquivos rastreados estavam modificados e arquivos não rastreados seriam
      sobrescritos. O rodapé exibia a data do arquivo VERSION da stack, não
      a versão do monitor.
    key_learnings:
      - "O Dockerfile do monitor copia Python, templates, estáticos e o arquivo VERSION na build. git pull no host não entra no container que já está rodando."
      - "A atualização do painel é docker compose up -d --build monitor, depois do pull ter concluído."
      - "A data do rodapé é o mtime do VERSION da stack. A versão do monitor é outro arquivo, copiado para a imagem."
      - "Pull com modificação local e untracked no mesmo caminho aborta. Dá para descartar o que é só cópia antiga do Git. .env, token e config do portal ficam de fora do reset."
    code_snippet: |
      git pull --ff-only
      docker compose up -d --build monitor
    impact_value: "O monitor em produção só muda de versão quando a imagem é reconstruída, e o pull deixa de ser bloqueado pelos arquivos que a VPS precisa manter."
    related_projects: ["lorentz-vps-stack"]
