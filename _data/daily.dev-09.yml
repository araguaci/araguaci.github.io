entries:
  - id: "DEV-2026-068"
    date: "2026-10-07"
    title: "No PHP 8 um filtro decimal vazio vira comparação com zero"
    category: "backend"
    tags: [php, php8, sql, adodb]
    slug: "filtro-decimal-vazio-vira-zero-no-php-8"
    summary: "O reset da lista de clientes montava WHERE de faturamento igual a zero dos dois lados, sem ninguém ter digitado filtro. No PHP 8, converter null com ew_StrToFloat devolve 0, e 0 diferente de string vazia passa a ser verdadeiro."
    problem_statement: >
      sac_clientelist.php?cmd=resetall gerava
      WHERE (ISNULL(Faturamento, 0) = 0 AND ISNULL(Faturamento, 0) = 0)
      ORDER BY NomeCli. SearchValue vinha de um GET ausente e SearchValue2
      nem é carregado na lista: os dois eram null. Faturamento é ADO 131
      (adNumeric), então ew_GetSearchSql chama ew_StrToFloat. Essa função
      devolve inteiro 0 para null. O teste antigo 0 <> "" descartava o
      campo vazio no PHP 5.6, porque lá 0 == "" é verdadeiro. No PHP 8.2
      essa comparação é falsa, então 0 <> "" entra no SQL. O operador
      vazio vira "=" e a condição vira AND. Refatorar em sac_clienteinfo.php
      só troca [Faturamento] = por ISNULL(Faturamento, 0) =. Com o WHERE
      preenchido, o comando virava search e a sessão gravava SearchWhere.
      Um load seguinte, sem resetall, restaurava o filtro.
    key_learnings:
      - "ew_StrToFloat(null) devolve 0. No PHP 8, 0 <> \"\" é verdadeiro. A conversão só pode rodar depois de recusar null e string vazia."
      - "Digitar 0 ainda tem de gerar [Faturamento] = 0. O ISNULL é a busca real por zero, não a origem do filtro fantasma."
      - "resetall limpa a sessão, mas o bug nascia de novo em AdvancedSearchWhere. O WHERE gravado só explica a página sem cmd=resetall."
    code_snippet: |
      // phpfn9.php — ew_GetSearchSql, campo float/numeric
      if (!is_null($FldVal) && $FldVal !== "")
          $FldVal = ew_StrToFloat($FldVal);
      if (!is_null($FldVal2) && $FldVal2 !== "")
          $FldVal2 = ew_StrToFloat($FldVal2);
    impact_value: "Reset da lista deixa de filtrar faturamento igual a zero quando os dois lados do campo estão vazios."
    related_projects: ["supervisor"]

  - id: "DEV-2026-069"
    date: "2026-10-07"
    title: "Acento no SQL derruba o sqlsrv do Linux sem CharacterSet UTF-8"
    category: "devops"
    tags: [php, sqlserver, docker, unixodbc]
    slug: "acento-no-sql-exige-charset-utf8-no-sqlsrv"
    summary: "A mesma lista de clientes abria no WAMP e, no container, pintava uma linha 00000. O COUNT passava porque não tem acento. O SELECT da grade carrega o literal Não e o unixODBC responde HY090 se a conexão não declara UTF-8."
    problem_statement: >
      No WAMP a página usa ADO (ado_mssql) e a grade lista o cliente.
      No container o ew_Connect abre mssqlnative (sqlsrv/unixODBC).
      EW_SELECT_LIMIT é falso no Windows e 1234 no Linux, então no
      Linux a página conta com getCountRows, que reescreve para
      SELECT COUNT(*) AS TOTAL FROM SAC_CLIENTE. Essa frase não tem
      acento e devolve a contagem. SqlSelect() em sac_clienteinfo.php
      inclui o literal Não em UTF-8 (bytes c3 a3). Sem CharacterSet
      na connectionInfo, o driver recusa o statement com HY090
      (Invalid string or buffer length). O recordset fica falso, mas
      o loop ainda chama LoadRowValues. str_pad de CdCli e NumExterno
      nulos vira 00000, e o MoveNext no recordset falso estoura antes
      do pager. A pasta log/ do host fica vazia: o container grava no
      volume supervisor-log. phpfn.php já manda UTF-8 quando
      PROJECT_CHARSET é utf-8, mas a lista inclui phpfn9.php.
      Reabrir a conexão com CharacterSet UTF-8 devolveu o registro
      que o COUNT já tinha contado.
    key_learnings:
      - "HY090 aqui foi charset, não coluna inexistente. O COUNT sem acento passar não prova que o SELECT da grade passou."
      - "ew_Connect em phpfn9.php precisa de CharacterSet UTF-8 junto com ReturnDatesAsStrings e TrustServerCertificate. Vale para toda página que usa essa conexão."
      - "A linha 00000 é str_pad de campo nulo, com a grade desenhada em cima de um recordset que não abriu."
      - "supervisor/api/phpfn9.php e supervisor/api/func.php ainda abrem o driver mssql antigo sem CharacterSet. A correção ficou no ew_Connect da aplicação web."
    code_snippet: |
      // phpfn9.php — ew_Connect, driver mssqlnative
      $conn->connectionInfo = array(
          'ReturnDatesAsStrings' => true,
          'TrustServerCertificate' => true,
          'CharacterSet' => 'UTF-8',
      );
    impact_value: "A lista de clientes no container passa a devolver o registro que o WAMP já mostrava."
    related_projects: ["supervisor", "lorentz-vps-stack"]

  - id: "DEV-2026-070"
    date: "2026-10-07"
    title: "No PHP 8 null não serve para strlen nem para propriedade"
    category: "backend"
    tags: [php, php8, legado]
    slug: "php8-null-em-strlen-e-propriedade"
    summary: "A lista de clientes avisava strlen(null) em short_name e leitura de DetailAdd num grid que continuava NULL. Os dois vinham de código que no PHP antigo seguia com valor vazio ou aviso mudo."
    problem_statement: >
      userfn9.php short_name recebia CurrentValue de NomeUsual, e esse
      valor pode ser null (a lista de clientes, a de atendimento e a
      home do Phoenix chamam a função assim). No PHP 8.2, strlen(null)
      é deprecated. O grid de endereço nasce NULL em
      sac_enderecogridcls.php. O bloco que criaria o objeto e as
      opções de lista está comentado. LoadRowValues só cria o global
      quando uma linha carrega. O painel de cima da lista está atrás
      de if (00 && ...), então não roda. O de baixo, na linha do
      DetailAdd, roda. Com o SELECT falhando, o loop ainda chegava
      nesse rodapé com o objeto inexistente. Atribuir o grid em
      $GLOBALS grava de verdade: a sonda mostrou que o objeto permanece.
      O null da linha 4210 é o objeto que ninguém criou. DetailAdd de
      SAC_ENDERECO já é FALSE em sac_enderecoinfo.php. A cópia da
      função em supervisor/api/userfn9.php ficou sem o cast.
    key_learnings:
      - "short_name começa com (string) $str. Null vira string vazia antes de strlen e substr."
      - "Ler DetailAdd exige is_object no grid. O painel comentado e o SELECT que não abre deixam o global em NULL."
      - "O contato da mesma grade já estava curto-circuitado com 00 &&. O endereço de baixo não estava."
    code_snippet: |
      // userfn9.php — short_name
      $str = (string) $str;

      // sac_clientelist.php — rodapé do endereço
      is_object($SAC_ENDERECO_grid) && $SAC_ENDERECO_grid->DetailAdd
    impact_value: "A lista deixa de avisar strlen(null) e leitura de DetailAdd quando o grid de endereço não foi criado."
    related_projects: ["supervisor"]
